        <!--
            Keep the site shell readable if a cached GitHub Pages document
            briefly points at a stylesheet from the previous deployment.
            The complete, hashed stylesheet is still the source of truth and
            overrides these intentionally small fallback rules.
        -->
        <style id="vl-critical-shell">
            :root {
                --vl-forest: #1b3a28;
                --vl-forest-2: #10271b;
                --vl-ink: #17261c;
                --vl-surface: #f5f3ee;
                --vl-white: #fff;
                --vl-accent: #d7a24a;
                --vl-hair: #e7e4db;
                --vl-muted: #59685e;
                --font-heading: "Newsreader", serif;
                --font-body: "Inter", sans-serif;
            }
            * { box-sizing: border-box; }
            body { margin: 0; background: var(--vl-white); color: var(--vl-ink); font: 15px var(--font-body); }
            a { color: inherit; text-decoration: none; }
            button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
            img { display: block; max-width: 100%; }
            .site-shell { min-height: 100vh; display: flex; flex-direction: column; }
            .site-main { flex: 1; }
            .seo-prerender { max-width: 760px; margin: 0 auto; padding: 72px 24px; }
            .seo-prerender h1 { margin: 0 0 18px; color: var(--vl-forest-2); font: 600 48px/1.08 var(--font-heading); }
            .seo-prerender p { margin: 0 0 16px; color: var(--vl-muted); font-size: 17px; line-height: 1.7; }
            .seo-prerender a { color: var(--vl-forest); font-weight: 700; text-decoration: underline; }
            .site-header { position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 72px; border-bottom: 1px solid var(--vl-hair); background: var(--vl-white); }
            .brand, .nav-menu, .nav-right, .nav-phone, .nav-cta { display: flex; align-items: center; }
            .brand { gap: 10px; }
            .brand-mark { width: 44px; height: 44px; object-fit: contain; }
            .brand-word { color: var(--vl-ink); font: 23px var(--font-heading); }
            .nav-menu { gap: 28px; }
            .nav-link { color: var(--vl-muted); }
            .nav-right { gap: 14px; }
            .nav-phone, .nav-cta { gap: 8px; font-weight: 600; }
            .nav-account { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--vl-hair); border-radius: 50%; }
            .nav-cta { padding: 11px 20px; border-radius: 999px; background: var(--vl-forest); color: var(--vl-white); }
            .nav-burger, .mobile-menu-head, .mobile-menu-footer, .mobile-menu-backdrop { display: none; }
            .site-footer { padding: 44px 72px; background: var(--vl-forest-2); color: var(--vl-white); }
            @media (max-width: 860px) {
                .site-header { padding: 14px 18px; }
                .nav-menu { display: none; }
                .nav-menu.is-open { position: absolute; top: 72px; right: 12px; left: 12px; display: flex; align-items: stretch; flex-direction: column; gap: 8px; padding: 18px; border-radius: 18px; background: var(--vl-white); box-shadow: 0 20px 60px #1023172b; }
                .nav-phone, .nav-right > .nav-link { display: none; }
                .seo-prerender { padding: 48px 18px; }
                .seo-prerender h1 { font-size: 36px; }
                .nav-burger { display: flex; width: 42px; height: 42px; align-items: center; justify-content: center; flex-direction: column; gap: 4px; border: 1px solid var(--vl-hair); border-radius: 13px; }
                .nav-burger-line { display: block; width: 18px; height: 2px; border-radius: 2px; background: currentColor; }
                .site-footer { padding: 36px 18px; }
            }
        </style>
        <script>
            (() => {
                const root = document.documentElement;
                const recoveryKey = `vl-css-recovery:${location.pathname}`;
                const recoveryCooldownMs = 30000;
                let checked = false;
                let localStylesheetFailed = false;

                addEventListener("error", (event) => {
                    const target = event.target;
                    if (!(target instanceof HTMLLinkElement) || target.rel !== "stylesheet") return;

                    try {
                        const url = new URL(target.href, location.href);
                        if (url.origin === location.origin && url.pathname.includes("/assets/")) {
                            localStylesheetFailed = true;
                        }
                    } catch (_) {}
                }, true);

                const finishCheck = () => {
                    if (checked) return;
                    checked = true;

                    const ready = getComputedStyle(root)
                        .getPropertyValue("--vl-css-ready")
                        .trim() === "1" && !localStylesheetFailed;
                    const url = new URL(location.href);

                    if (ready) {
                        try { sessionStorage.removeItem(recoveryKey); } catch (_) {}
                        if (url.searchParams.has("vl-css-recovery")) {
                            url.searchParams.delete("vl-css-recovery");
                            history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
                        }
                        return;
                    }

                    const now = Date.now();
                    let attempted = url.searchParams.has("vl-css-recovery");
                    try {
                        const lastAttempt = Number(sessionStorage.getItem(recoveryKey));
                        attempted = attempted || (Number.isFinite(lastAttempt)
                            && lastAttempt > 0
                            && Math.abs(now - lastAttempt) < recoveryCooldownMs);
                        if (!attempted) sessionStorage.setItem(recoveryKey, now.toString());
                    } catch (_) {}

                    if (!attempted) {
                        url.searchParams.set("vl-css-recovery", now.toString());
                        location.replace(url.toString());
                        return;
                    }

                    root.classList.add("vl-css-failed");
                    if (url.searchParams.has("vl-css-recovery")) {
                        url.searchParams.delete("vl-css-recovery");
                        history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
                    }
                };

                addEventListener("load", finishCheck, { once: true });
                setTimeout(finishCheck, 8000);
            })();
        </script>
