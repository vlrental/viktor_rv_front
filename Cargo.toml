[package]
name = "viktor_rv_front"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
chrono = { version = "0.4.40", features = ["serde", "wasmbind"] }
chrono-tz = "0.10.4"
gloo-net = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
urlencoding = "2.1.3"
web-sys = { version = "0.3.83", features = ["Window", "Storage", "Location", "File", "FormData", "Document", "Element", "HtmlElement", "Node"] }
uuid = { version = "1.17.0", features = ["v4", "js"] }
wasm-bindgen = "0.2.106"

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 3
