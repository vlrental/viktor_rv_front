name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned asset tooling
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-lucide-subset.txt
      - name: Verify Lucide subset and source coverage
        run: python3 scripts/generate_lucide_subset.py --check
      - name: Verify lossless snapshot logo
        run: python3 scripts/generate_responsive_images.py --check
      - name: Validate formatting
        run: cargo fmt --all --check
      - name: Run frontend tests
        run: cargo test --all-targets
      - name: Run storefront bundle tests
        run: cargo test --all-targets --features storefront_bundle
      - name: Test Pages artifact verifier
        run: python3 -m unittest scripts/test_prepare_pages_artifact.py scripts/test_verify_pages_artifact.py scripts/test_rv_only_content.py scripts/test_lucide_subset.py scripts/test_responsive_images.py scripts/test_pages_variants.py
      - name: Reject compiler warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: Reject storefront bundle compiler warnings
        run: cargo clippy --all-targets --features storefront_bundle -- -D warnings
      - name: Check browser build target
        run: cargo check --target wasm32-unknown-unknown
      - name: Check storefront browser build target
        run: cargo check --target wasm32-unknown-unknown --features storefront_bundle

  build:
    # A dev build is available only through a deliberate manual dispatch. Normal
    # dev pushes do not publish anything; pushing main is the production path.
    # Manual dispatches may republish either dev or main after repository moves
    # or Pages configuration changes.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous Pages assets
        id: restore-pages-assets
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .pages-assets-cache
          key: pages-assets-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-assets-${{ github.ref_name }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Select production URL and base path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VL_FRONTEND_BASE_URL=https://vlrental.ca" >> "$GITHUB_ENV"
            echo "VL_FRONTEND_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "VL_FRONTEND_BASE_URL=https://${{ github.repository_owner }}.github.io/viktor_rv_front" >> "$GITHUB_ENV"
            echo "VL_FRONTEND_BASE_PATH=viktor_rv_front" >> "$GITHUB_ENV"
          fi
      - name: Build storefront and full admin variants
        run: python3 scripts/build_pages_variants.py --base-path "$VL_FRONTEND_BASE_PATH"
      - name: Fetch published RV sale inventory once
        run: python3 scripts/fetch_public_sales_snapshot.py "$RUNNER_TEMP/public-rv-sales.json"
      - name: Prepare and merge Pages variants
        run: python3 scripts/prepare_pages_variants.py target/dx/viktor_rv_front/release/web/public target/dx/viktor_rv_front/release/web/admin-public "$VL_FRONTEND_BASE_URL" "$RUNNER_TEMP/public-rv-sales.json"
      - name: Snapshot current dual-bundle asset union
        run: python3 scripts/manage_pages_asset_cache.py snapshot target/dx/viktor_rv_front/release/web/public "$RUNNER_TEMP/pages-assets-v2.json"
      - name: Merge one bounded previous asset generation
        run: |
          if [ -d .pages-assets-cache ]; then
            if [ -f .pages-assets-cache/.vl-pages-generation-v1 ]; then
              mv .pages-assets-cache .pages-assets-previous
            else
              mv .pages-assets-cache "$RUNNER_TEMP/viktor-rv-unversioned-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
          fi
          if [ -d .pages-assets-previous ]; then
            python3 scripts/manage_pages_asset_cache.py merge .pages-assets-previous target/dx/viktor_rv_front/release/web/public
          fi
      - name: Keep dev metadata on GitHub Pages
        if: github.ref_name == 'dev'
        run: |
          sed -i 's#https://vlrental.ca/#https://${{ github.repository_owner }}.github.io/viktor_rv_front/#g' target/dx/viktor_rv_front/release/web/public/index.html
      - name: Verify Pages asset references and CSS recovery
        run: python3 scripts/verify_pages_artifact.py target/dx/viktor_rv_front/release/web/public
      - name: Stage the current asset union for the next deployment
        run: |
          mkdir -p .pages-assets-cache
          python3 scripts/manage_pages_asset_cache.py stage "$RUNNER_TEMP/pages-assets-v2.json" target/dx/viktor_rv_front/release/web/public .pages-assets-cache
          touch .pages-assets-cache/.vl-pages-generation-v1
      - name: Save current Pages assets for the next deployment
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .pages-assets-cache
          key: pages-assets-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/viktor_rv_front/release/web/public

  deploy:
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-test' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
