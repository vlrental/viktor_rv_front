name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate formatting
        run: cargo fmt --all --check
      - name: Run frontend tests
        run: cargo test --all-targets
      - name: Test Pages artifact verifier
        run: python3 -m unittest scripts/test_verify_pages_artifact.py
      - name: Reject compiler warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: Check browser build target
        run: cargo check --target wasm32-unknown-unknown

  build:
    # A dev build is available only through a deliberate manual dispatch. Normal
    # dev pushes do not publish anything; pushing main is the production path.
    if: github.event_name == 'push' || github.ref_name == 'dev'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous Pages assets
        id: restore-pages-assets
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .pages-assets-cache
          key: pages-assets-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-assets-${{ github.ref_name }}-
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Start with a fresh Pages output directory
        run: |
          output=target/dx/viktor_rv_front/release/web/public
          if [ -d "$output" ]; then
            mv "$output" "$RUNNER_TEMP/viktor-rv-pages-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
      - name: Build site
        env:
          VL_FRONTEND_BASE_URL: https://${{ github.repository_owner }}.github.io/viktor_rv_front
        run: dx build --release --web --debug-symbols false --base-path viktor_rv_front
      - name: Preserve one previous asset generation
        run: |
          output=target/dx/viktor_rv_front/release/web/public/assets
          if [ -d .pages-assets-cache ]; then
            if [ -f .pages-assets-cache/.vl-pages-generation-v1 ]; then
              mv .pages-assets-cache .pages-assets-previous
            else
              mv .pages-assets-cache "$RUNNER_TEMP/viktor-rv-unversioned-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
          fi
          mkdir -p .pages-assets-cache
          cp -a "$output/." .pages-assets-cache/
          touch .pages-assets-cache/.vl-pages-generation-v1
          if [ -d .pages-assets-previous ]; then
            cp -a -n .pages-assets-previous/. "$output/"
          fi
      - name: Keep dev metadata on GitHub Pages
        if: github.ref_name == 'dev'
        run: |
          sed -i 's#https://vlrental.ca/#https://${{ github.repository_owner }}.github.io/viktor_rv_front/#g' target/dx/viktor_rv_front/release/web/public/index.html
      - name: Prepare Pages artifact
        run: cp target/dx/viktor_rv_front/release/web/public/index.html target/dx/viktor_rv_front/release/web/public/404.html
      - name: Verify Pages asset references and CSS recovery
        run: python3 scripts/verify_pages_artifact.py target/dx/viktor_rv_front/release/web/public
      - name: Save current Pages assets for the next deployment
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .pages-assets-cache
          key: pages-assets-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/viktor_rv_front/release/web/public

  deploy:
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-test' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
